description = "Implement tasks incrementally — build, test, verify, commit. Add 'auto' to run the whole plan in one approved pass."

prompt = """
Invoke the incremental-implementation skill alongside test-driven-development.

## Modes

- `/build` — implement the next pending task (careful, one slice at a time)
- `/build auto` — generate the plan, get approval, then implement every task without stopping

## Default: one task

1. Read the task's acceptance criteria
2. Load relevant context (existing code, patterns, types)
3. Write a failing test (RED)
4. Implement the minimum code to pass (GREEN)
5. Run the full test suite
6. Run the build
7. Commit with a descriptive message
8. Mark the task complete and stop

## Autonomous: the whole plan (`/build auto`)

1. Require a spec (SPEC.md or docs/SPEC.md)
2. Establish a clean baseline (`git status`)
3. Plan if needed (tasks/plan.md)
4. Single checkpoint - wait for approval
5. Execute every task in dependency order (RED → GREEN → regression → build → commit)
6. Stop and ask when: test fails, spec ambiguous, high-risk task
7. Summarize at the end

If any step fails, follow the debugging-and-error-recovery skill.
"""
