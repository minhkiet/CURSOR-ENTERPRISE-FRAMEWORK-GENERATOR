name: tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ponytail: pytest-cov provides the `coverage` CLI used by the
      # coverage steps below and writes .coverage / htmlcov.
      - name: Run pytest
        run: pytest --tb=short -v --cov=cursor_framework --cov-report=term-missing --cov-report=html:htmlcov

      - name: Coverage summary
        if: always()
        run: |
          coverage report --skip-covered
          echo "Coverage report generated under htmlcov/"

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
          retention-days: 14

      # ponytail: pin to .NET 8 — csproj targets net8.0-windows. .NET 9/10
      # SDKs sometimes change codegen for WinForms in subtle ways. Match the
      # version explicitly so CI matches local dev (8.0.416).
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ponytail: the GUI lives in cursor-setup-gui-wpf (the old
      # cursor-setup-gui console project was removed). Build the WPF app so
      # a broken XAML or resource file fails CI instead of the release.
      - name: Build C# GUI
        working-directory: cursor-setup-gui-wpf
        run: |
          dotnet --version
          dotnet build -c Release --nologo
          $exe = "bin/Release/net8.0-windows/win-x64/VibeCodeEnterpriseFramework.exe"
          if (-not (Test-Path $exe)) { throw "expected build output $exe" }
          Write-Host "OK: GUI built at $exe"
