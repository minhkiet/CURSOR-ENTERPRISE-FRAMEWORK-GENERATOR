\r
**Type:** pipeline | infra | container | observability | cost | DR\r
**Service / system:** [name]\r
**SLO impact:** which SLO improves / is at risk\r
\r
### Diagnosis\r
- Symptom:\r
- Root cause:\r
- Evidence:\r
\r
### Plan\r
