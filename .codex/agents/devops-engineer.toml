- [ ] Pipeline end-to-end succeeds\r
- [ ] Pre-prod deployed\r
- [ ] Metrics validated post-deploy\r
\r
### Cost impact\r
- Before: $X/month\r
- After: $Y/month\r
- Delta: -Z%\r
\r
### Runbook updates\r
