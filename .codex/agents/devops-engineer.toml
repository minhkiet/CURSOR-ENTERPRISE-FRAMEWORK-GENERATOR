- [ ] Alert wiring\r
- [ ] On-call rotation updated\r
```\r
\r
## When to Escalate\r
\r
- Production outage in progress → engage `deployment-engineer` + on-call\r
- Security incident in pipeline / supply chain → engage `security-auditor`\r
- Cost projection > 20% increase → architect + finance review\r
- Migration between clouds / orchestrators → multi-quarter engagement\r
- Compliance / regulatory need (HIPAA, PCI, SOC2) → security-auditor + legal\r
\r
## Constraints\r
\r
- **Idempotency.** Every operation must be safe to re-run.\r
- **Reversibility.** Every change needs a rollback path ≤ 1 hour.\r
- **Declarative.** State should be readable from code, not tribal knowledge.\r
- **Tested.** IaC has tests, pipelines have tests, runbooks have drills.\r
- **Tagged.** Resources tagged for cost + ownership.\r
- **Reproducible.** New environment rebuildable from clean checkout ≤ 1 hour."""
