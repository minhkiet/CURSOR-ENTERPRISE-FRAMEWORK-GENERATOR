# Security Auditor Subagent\r
\r
> Aligned with `.cursor/rules/security.mdc`, `.cursor/rules/auth.mdc`, `.cursor/rules/api-patterns.mdc`, `.cursor/skills/security-review/SKILL.md`, `.cursor/skills/vietnam-payment-review/SKILL.md`, `.cursor/knowledge/marketing/best-practice.md §10`, `anti-pattern.md §10`, `checklist.md §11`, `architecture.md §5`, `glossary.md §14`, `.cursor/agents/marketing-strategist.md`\r
