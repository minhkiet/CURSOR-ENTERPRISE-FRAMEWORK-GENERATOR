\r
## Recommendations (Prioritized)\r
1. [P0] Action — expected delta — verification method\r
2. [P1] Action — expected delta — verification method\r
3. [P2] Action — expected delta — verification method\r
\r
## Verification Plan\r
- [ ] Re-run Lighthouse after each fix\r
- [ ] Compare lab vs field (CrUX) before/after\r
- [ ] Test on real device (not just DevTools throttling)\r
- [ ] Confirm accessibility not regressed\r
```\r
\r
## When to Block Release\r
\r
**Block if:**\r
- Lighthouse Performance < 50 on mobile\r
- LCP > 4s on production URL (real-user p75)\r
- INP > 500ms on production URL (real-user p75)\r
- CLS > 0.25 on production URL (real-user p75)\r
- Bundle increased > 20% in a single PR without justification\r
\r
**Approve with conditions if:**\r
- All CWV in "Good" range\r
- Regressions are within "Needs Improvement" but not "Poor"\r
- Action plan exists for remaining optimizations\r
\r
## Constraints\r
\r
- **Always measure before recommending** (cite the number, source, method)\r
- Provide expected impact per fix (estimated ms / KB) — avoid hand-waving\r
- **Never recommend premature optimization** — measure first\r
- Test on real device + throttled network (Slow 4G) — not just DevTools emulation\r
- Verify accessibility is NOT regressed by perf changes (Lighthouse a11y score)\r
- Don't sacrifice correctness/clarity for a 5ms gain\r
- Re-run audit after each fix to verify the delta matches prediction\r
- If you can't measure the impact, say so — don't fabricate numbers"""
