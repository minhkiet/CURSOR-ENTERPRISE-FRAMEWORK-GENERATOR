<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="ux-map-title ux-map-desc">
  <title id="ux-map-title">Sơ đồ quyết định UI/UX từ brief đến kiểm tra</title>
  <desc id="ux-map-desc">Năm bước lần lượt: brief, mô hình nội dung, tỷ lệ bố cục, token và trạng thái kiểm tra.</desc>
  <defs>
    <pattern id="ux-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ddd8cd" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="760" fill="#f4f1ea"/>
  <rect width="1200" height="760" fill="url(#ux-grid)"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#1c201d">
    <text x="64" y="72" font-size="13" letter-spacing="3" fill="#8a5641">FIELD GUIDE · DECISION MAP</text>
    <text x="64" y="128" font-size="40" font-family="Iowan Old Style, Palatino, Georgia, serif" font-weight="600">Từ brief đến component</text>
    <text x="64" y="164" font-size="17" fill="#59605a">Mỗi bước chỉ trả lời một câu hỏi. Không nhảy thẳng vào màu sắc hay hiệu ứng.</text>

    <line x1="64" y1="196" x2="1136" y2="196" stroke="#1c201d" stroke-width="2"/>

    <g>
      <rect x="64" y="236" width="196" height="172" rx="2" fill="#fbfaf7" stroke="#1c201d" stroke-width="2"/>
      <text x="88" y="274" font-size="12" fill="#8a5641" letter-spacing="2">01 / BRIEF</text>
      <text x="88" y="318" font-size="23" font-weight="600">Vấn đề gì?</text>
      <text x="88" y="350" font-size="15" fill="#59605a">Người dùng, mục tiêu,</text>
      <text x="88" y="374" font-size="15" fill="#59605a">ràng buộc kỹ thuật.</text>
    </g>
    <path d="M 268 322 L 322 322" stroke="#1c201d" stroke-width="2"/>
    <path d="M 316 316 L 324 322 L 316 328" fill="none" stroke="#1c201d" stroke-width="2"/>

    <g>
      <rect x="332" y="236" width="196" height="172" rx="2" fill="#fbfaf7" stroke="#1c201d" stroke-width="2"/>
      <text x="356" y="274" font-size="12" fill="#8a5641" letter-spacing="2">02 / CONTENT</text>
      <text x="356" y="318" font-size="23" font-weight="600">Dữ liệu gì?</text>
      <text x="356" y="350" font-size="15" fill="#59605a">Trường thông tin, ngữ cảnh,</text>
      <text x="356" y="374" font-size="15" fill="#59605a">văn bản thật.</text>
    </g>
    <path d="M 536 322 L 590 322" stroke="#1c201d" stroke-width="2"/>
    <path d="M 584 316 L 592 322 L 584 328" fill="none" stroke="#1c201d" stroke-width="2"/>

    <g>
      <rect x="600" y="236" width="196" height="172" rx="2" fill="#fbfaf7" stroke="#1c201d" stroke-width="2"/>
      <text x="624" y="274" font-size="12" fill="#8a5641" letter-spacing="2">03 / LAYOUT</text>
      <text x="624" y="318" font-size="23" font-weight="600">Ưu tiên gì?</text>
      <text x="624" y="350" font-size="15" fill="#59605a">Tỷ lệ cột, nhịp đọc,</text>
      <text x="624" y="374" font-size="15" fill="#59605a">điểm nhấn thị giác.</text>
    </g>
    <path d="M 804 322 L 858 322" stroke="#1c201d" stroke-width="2"/>
    <path d="M 852 316 L 860 322 L 852 328" fill="none" stroke="#1c201d" stroke-width="2"/>

    <g>
      <rect x="868" y="236" width="268" height="172" rx="2" fill="#fbfaf7" stroke="#1c201d" stroke-width="2"/>
      <text x="892" y="274" font-size="12" fill="#8a5641" letter-spacing="2">04 / TOKENS + 05 / STATES</text>
      <text x="892" y="318" font-size="23" font-weight="600">Duy nhất và đo được?</text>
      <text x="892" y="350" font-size="15" fill="#59605a">Một accent, một nhịp spacing,</text>
      <text x="892" y="374" font-size="15" fill="#59605a">đủ trạng thái trước khi ship.</text>
    </g>

    <line x1="64" y1="448" x2="1136" y2="448" stroke="#1c201d" stroke-width="2"/>

    <text x="64" y="492" font-size="13" letter-spacing="2" fill="#8a5641">KIỂM TRA TRƯỚC KHI CODE</text>

    <g>
      <rect x="64" y="520" width="336" height="132" rx="2" fill="#fbfaf7" stroke="#c9c3b7"/>
      <text x="88" y="558" font-size="18" font-weight="600">Nội dung có thật không?</text>
      <text x="88" y="592" font-size="15" fill="#59605a">Thay placeholder bằng ca sử dụng</text>
      <text x="88" y="616" font-size="15" fill="#59605a">và dữ liệu có ngữ cảnh.</text>
    </g>
    <g>
      <rect x="432" y="520" width="336" height="132" rx="2" fill="#fbfaf7" stroke="#c9c3b7"/>
      <text x="456" y="558" font-size="18" font-weight="600">Focus có nhìn thấy không?</text>
      <text x="456" y="592" font-size="15" fill="#59605a">Mọi điều khiển đều có trạng thái</text>
      <text x="456" y="616" font-size="15" fill="#59605a">:focus-visible rõ ràng.</text>
    </g>
    <g>
      <rect x="800" y="520" width="336" height="132" rx="2" fill="#fbfaf7" stroke="#c9c3b7"/>
      <text x="824" y="558" font-size="18" font-weight="600">Motion có cần thiết không?</text>
      <text x="824" y="592" font-size="15" fill="#59605a">Giữ ngữ cảnh khi tắt hiệu ứng</text>
      <text x="824" y="616" font-size="15" fill="#59605a">và khi reduce motion.</text>
    </g>

    <text x="64" y="708" font-size="13" fill="#59605a">Vibe Framework · template ui-ux · sơ đồ minh họa, không phải ảnh chụp giao diện</text>
  </g>
</svg>
