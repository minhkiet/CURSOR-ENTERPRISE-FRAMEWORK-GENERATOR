[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-framework"
version = "1.2.0"
description = "Cursor Enterprise Framework - Python Library + CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cursor Enterprise Framework" }]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
http = ["requests>=2.31.0"]
env = ["python-dotenv>=1.0.0"]
dev = ["requests>=2.31.0", "python-dotenv>=1.0.0", "build>=1.0"]

[project.scripts]
cursor-framework = "cursor_framework.__main__:main"

[tool.setuptools.packages.find]
include = ["cursor_framework*"]
